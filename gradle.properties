android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Relay base URLs the app tries in order. The default only works over USB (adb reverse).
# Put your own list in ~/.gradle/gradle.properties (it overrides this file and stays out of git), e.g.
#   hermesRelayUrls=http://127.0.0.1:8765,http://<your-pc>.<your-tailnet>.ts.net:8765
hermesRelayUrls=http://127.0.0.1:8765
